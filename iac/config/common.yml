# Project tag value, also the default `prefix` for resource names.
project: brb

# Resource naming pattern: <prefix>-<resource-core-name>-<suffix>.
# The "core name" is owned by each resource construct (its CORE_NAME constant)
# — there are no resource names in this config.
# prefix: null     # falls back to `project`
# suffix: null     # falls back to `env`

indexDocument: index.html
errorDocument: index.html

siteSourcePath: ../web
siteExclude:
  - .DS_Store

# The CloudFront distribution in front of the site bucket. It pre-exists and
# is NOT managed by this stack. Set distributionId (per env, in <env>.yml) to
# make every deploy invalidate the edge cache (/*) so content changes show up
# in minutes instead of waiting out the default TTL. domainName is
# informational (invalidation only needs the id).
# Two one-time manual steps still live on the distribution itself:
#   1. Attach the EdgeRedirects CloudFront Function (apex->www 301 +
#      trailing-slash strip) as the default behavior's viewer-request function.
#   2. Add a Custom Error Response: 403 -> /404.html with response code 404
#      (low error-caching TTL, e.g. 60s) so bad URLs get the branded 404
#      instead of S3's AccessDenied XML.
cloudfront:
  distributionId: null
  domainName: null

lambda:
  runtime: python3.12
  handler: handler.lambda_handler
  # Path to the lambda source directory, relative to the project root.
  codePath: lambda/signup
  timeoutSeconds: 30
  memoryMb: 256
  envVars: {}

ses:
  fromAddress: info@backroombrewery.com
  toAddress: info@backroombrewery.com
  # Extra addresses to verify on top of fromAddress/toAddress (e.g. test inboxes
  # while in SES sandbox). Each gets a click-to-verify email.
  verifyEmails: []

holidayMarket:
  # Where vendor applications are emailed. `null` falls back to ses.toAddress.
  # If set, the address is auto-added to the SES verify list.
  toAddress: null
  lambda:
    runtime: python3.12
    handler: handler.lambda_handler
    codePath: lambda/holidaymarket
    timeoutSeconds: 30
    memoryMb: 256
    envVars: {}

api:
  # CORS allowlist for the REST API. Default `null` means allow any origin —
  # tighten in prod (e.g. ["https://www.backroombreweryva.com"]).
  allowedOrigins: null

facebook:
  # Facebook Page whose upcoming events are shown on /events. Page id or slug.
  pageId: BackroomBrewery
  # Long-lived Page access token used to read the events. Override at deploy
  # time via the FB_PAGE_TOKEN env var; do NOT commit a real token here.
  # Without a token the /fbevents endpoint returns an empty list and the
  # events page falls back to a "see it on Facebook" link.
  pageToken: null
  graphVersion: v21.0
  # How long the Lambda (and browsers, via Cache-Control) cache the feed.
  cacheSeconds: 1800
  eventsLimit: 10
  lambda:
    runtime: python3.12
    handler: handler.lambda_handler
    codePath: lambda/fbevents
    timeoutSeconds: 10
    memoryMb: 128
    envVars: {}

altcha:
  # Proof-of-work difficulty: client iterates up to maxNumber to find solution.
  # 50000 keeps verification under ~1s on modern hardware.
  maxNumber: 50000
  # How long an issued challenge stays valid (seconds).
  expiresSeconds: 600
  # HMAC key shared by the challenge + signup lambdas. Override at deploy time
  # via the ALTCHA_HMAC_KEY env var; do NOT commit a real secret here.
  hmacKey: null
  challenge:
    runtime: python3.12
    handler: handler.lambda_handler
    codePath: lambda/altcha-challenge
    timeoutSeconds: 5
    memoryMb: 128
    envVars: {}
